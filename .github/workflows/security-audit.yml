name: Security audit

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Weekly, Monday 06:00 UTC — catches newly published advisories between releases.
    - cron: '0 6 * * 1'

jobs:
  pnpm-audit:
    name: pnpm audit (production dependencies)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # pnpm/action-setup only needs a Node runtime, which ubuntu-latest
      # ships preinstalled. actions/setup-node is deliberately omitted: its
      # post step tried to save a pnpm store cache for a store this job
      # never creates (no install happens here) and failed the whole job.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Audit pnpm-lock.yaml
        run: pnpm audit --prod
