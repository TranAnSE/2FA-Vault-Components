name: Security audit

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Weekly, Monday 06:00 UTC — catches newly published advisories between releases.
    - cron: '0 6 * * 1'

jobs:
  pnpm-audit:
    name: pnpm audit (production dependencies)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Audit pnpm-lock.yaml
        run: pnpm audit --prod
